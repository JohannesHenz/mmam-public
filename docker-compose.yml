version: "3.8"

services:
  database:
    build:
      context: ./docker
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - "5432:5432"

  app:
    build:
      dockerfile: Dockerfile.app
    depends_on:
      - database
    volumes:
      - .:/usr/src/app
      - ./docker/cert.pem:/usr/src/app/certs/cert.pem
      - ./docker/key.pem:/usr/src/app/certs/key.pem
    ports:
      - "3313:3313"
    environment:
      NODE_ENV: development  # Set environment to development for hot-reloading replace with production if not in development
      DATABASE_URL: postgres://postgres:postgres@database:5432/postgres
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    command: npm run dev  # Run nodemon for development hot-reloading

volumes:
  db_data: