services:
  database:
    build:
      context: ./docker
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      - database
    volumes:
      # Mount the source for hot-reloading; certs/ is picked up from the project root
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "443:443"
    environment:
      NODE_ENV: development # use "production" to run without nodemon
      DATABASE_URL: postgres://postgres:postgres@database:5432/mmam
    command: npm run dev

volumes:
  db_data:
